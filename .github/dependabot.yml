# Aggiornamento automatico delle dipendenze di «PostiPerfetti».
#
# Le versioni in requirements.txt sono volutamente CONGELATE, perché la
# stessa versione di «PostiPerfetti» deve installare lo stesso ambiente anche
# a distanza di mesi. Il rovescio della medaglia è che una correzione di
# sicurezza di Qt non arriverebbe mai da sola: Dependabot serve esattamente
# a questo, ad avvisare quando esce qualcosa, lasciando allo sviluppatore
# la decisione se e quando adottarlo.
#
# Parte di «PostiPerfetti». Autore: prof. Omar Ceretta. Licenza: GNU GPLv3.

version: 2

updates:
  # ── Dipendenze Python ────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dipendenze
    groups:
      # Un'unica PR per gli aggiornamenti minori e di patch: sono quelli
      # che si accettano quasi sempre in blocco dopo aver visto la CI verde.
      python-minori:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    # I salti di versione MAGGIORE restano PR separate: PySide6 ha già
    # cambiato comportamento fra major, e vanno provati a mano sulla GUI.

  # ── Dipendenze di sviluppo ───────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/documentazione/sviluppo"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps-dev"
    labels:
      - dipendenze
      - sviluppo

  # ── Azioni usate nei workflow GitHub ─────────────────────────────────
  # Sono codice di terze parti che gira con i permessi del repository:
  # tenerle aggiornate conta quanto tenere aggiornate le librerie.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: "ci"
    labels:
      - ci
